<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1500" height="1060" viewBox="0 0 1500 1060" role="img" aria-labelledby="title description">
  <title id="title">DisplayList Explorer icon candidates</title>
  <desc id="description">Six icon directions labeled A through F.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#172033" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1500" height="1060" rx="36" fill="url(#background)"/>
  <circle cx="58" cy="61" r="9" fill="#ef5b2a"/>
  <circle cx="86" cy="61" r="9" fill="#246bfd"/>
  <text x="116" y="70" fill="#172033" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="34" font-weight="760" letter-spacing="-1.1">DisplayList Explorer · Icon directions</text>

  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <g transform="translate(45 120)" filter="url(#card-shadow)">
      <rect width="450" height="430" rx="28" fill="#ffffff" stroke="#dfe3e8"/>
      <image xlink:href="option-a.png" href="option-a.png" x="45" y="10" width="360" height="360"/>
      <circle cx="56" cy="393" r="19" fill="#172033"/>
      <text x="56" y="400" fill="#ffffff" font-size="20" font-weight="800" text-anchor="middle">A</text>
      <text x="88" y="401" fill="#3f4b5f" font-size="20" font-weight="650">Nested Layers</text>
    </g>

    <g transform="translate(525 120)" filter="url(#card-shadow)">
      <rect width="450" height="430" rx="28" fill="#ffffff" stroke="#dfe3e8"/>
      <image xlink:href="option-b.png" href="option-b.png" x="45" y="10" width="360" height="360"/>
      <circle cx="56" cy="393" r="19" fill="#172033"/>
      <text x="56" y="400" fill="#ffffff" font-size="20" font-weight="800" text-anchor="middle">B</text>
      <text x="88" y="401" fill="#3f4b5f" font-size="20" font-weight="650">Mapping Panes</text>
    </g>

    <g transform="translate(1005 120)" filter="url(#card-shadow)">
      <rect width="450" height="430" rx="28" fill="#ffffff" stroke="#dfe3e8"/>
      <image xlink:href="option-c.png" href="option-c.png" x="45" y="10" width="360" height="360"/>
      <circle cx="56" cy="393" r="19" fill="#172033"/>
      <text x="56" y="400" fill="#ffffff" font-size="20" font-weight="800" text-anchor="middle">C</text>
      <text x="88" y="401" fill="#3f4b5f" font-size="20" font-weight="650">S-expression Core</text>
    </g>

    <g transform="translate(45 580)" filter="url(#card-shadow)">
      <rect width="450" height="430" rx="28" fill="#ffffff" stroke="#dfe3e8"/>
      <image xlink:href="option-d.png" href="option-d.png" x="45" y="10" width="360" height="360"/>
      <circle cx="56" cy="393" r="19" fill="#172033"/>
      <text x="56" y="400" fill="#ffffff" font-size="20" font-weight="800" text-anchor="middle">D</text>
      <text x="88" y="401" fill="#3f4b5f" font-size="20" font-weight="650">List Inspector</text>
    </g>

    <g transform="translate(525 580)" filter="url(#card-shadow)">
      <rect width="450" height="430" rx="28" fill="#ffffff" stroke="#dfe3e8"/>
      <image xlink:href="option-e.png" href="option-e.png" x="45" y="10" width="360" height="360"/>
      <circle cx="56" cy="393" r="19" fill="#172033"/>
      <text x="56" y="400" fill="#ffffff" font-size="20" font-weight="800" text-anchor="middle">E</text>
      <text x="88" y="401" fill="#3f4b5f" font-size="20" font-weight="650">Folding List</text>
    </g>

    <g transform="translate(1005 580)" filter="url(#card-shadow)">
      <rect width="450" height="430" rx="28" fill="#ffffff" stroke="#dfe3e8"/>
      <image xlink:href="option-f.png" href="option-f.png" x="45" y="10" width="360" height="360"/>
      <circle cx="56" cy="393" r="19" fill="#172033"/>
      <text x="56" y="400" fill="#ffffff" font-size="20" font-weight="800" text-anchor="middle">F</text>
      <text x="88" y="401" fill="#3f4b5f" font-size="20" font-weight="650">Paired Brackets</text>
