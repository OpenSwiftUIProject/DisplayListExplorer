<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="1040" viewBox="0 0 1600 1040">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f4ee"/>
      <stop offset="1" stop-color="#ede7dc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#172033" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1600" height="1040" fill="url(#bg)"/>

  <text x="56" y="58" fill="#172033" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="760" letter-spacing="-0.5">DisplayList Explorer — logo finalists</text>
  <text x="56" y="92" fill="#657083" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17">Framework review: 16 px legibility · monochrome · distinctiveness · vector redraw</text>

  <g filter="url(#shadow)">
    <rect x="50" y="125" width="735" height="850" rx="28" fill="#fffdf9"/>
    <rect x="815" y="125" width="735" height="850" rx="28" fill="#fffdf9"/>
  </g>

  <image x="68" y="143" width="699" height="699" preserveAspectRatio="xMidYMid meet" xlink:href="directions/a-dl-fold-board.png"/>
  <image x="833" y="143" width="699" height="699" preserveAspectRatio="xMidYMid meet" xlink:href="directions/b-compact-trace-board.png"/>

  <rect x="76" y="864" width="42" height="42" rx="12" fill="#172033"/>
  <text x="97" y="893" text-anchor="middle" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="800">A</text>
  <text x="136" y="884" fill="#172033" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="760">DL Fold</text>
  <text x="136" y="914" fill="#657083" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16">44 / 50 · strongest favicon · memorable monogram</text>
  <text x="76" y="951" fill="#a54325" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="650">Watch: avoid generic D/L monogram collision</text>

  <rect x="841" y="864" width="42" height="42" rx="12" fill="#ef5b2a"/>
  <text x="862" y="893" text-anchor="middle" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="800">B</text>
  <text x="901" y="884" fill="#172033" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="760">Compact Trace</text>
  <text x="901" y="914" fill="#657083" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16">43 / 50 · most product-specific · expresses compaction</text>
  <text x="841" y="951" fill="#a54325" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="650">Watch: simplify the 16 px micro-mark</text>

  <text x="800" y="1013" text-anchor="middle" fill="#657083" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">C / Shared Range was rejected: the symbol misreads as a chain, bracket, or generic compare icon.</text>
</svg>
