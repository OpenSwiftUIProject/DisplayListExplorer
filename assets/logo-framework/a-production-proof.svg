  <rect x="48" y="552" width="484" height="118" rx="24" fill="#172033"/>
  <circle cx="82" cy="586" r="5" fill="#EF5B2A"/>
  <text x="102" y="592" fill="#F7F4EE" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700">DESCRIPTION  ↔  MINIMAL</text>
