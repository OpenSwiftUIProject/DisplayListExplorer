  <text x="56" y="92" fill="#687386" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16">Vector redraw · flat color · optical small-size test</text>
  <rect x="48" y="126" width="484" height="402" rx="28" fill="#FFFDF9"/>
  <use href="#primary" x="92" y="166" width="230" height="230"/>
  <text x="346" y="237" fill="#172033" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="42" font-weight="780" letter-spacing="-1.9">DisplayList</text>
  <text x="346" y="282" fill="#172033" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="39" font-weight="470" letter-spacing="-1.5">Explorer</text>
  <text x="92" y="478" fill="#687386" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">PRIMARY LOCKUP</text>
  <rect x="556" y="126" width="278" height="242" rx="28" fill="#FFFDF9"/>
  <use href="#mono" x="624" y="158" width="142" height="142" color="#000000"/>
  <text x="588" y="338" fill="#687386" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">ONE COLOR</text>
  <rect x="858" y="126" width="294" height="242" rx="28" fill="#172033"/>
  <g style="--proof-bg:#172033"><use href="#mono" x="934" y="158" width="142" height="142" color="#F7F4EE"/></g>
  <text x="890" y="338" fill="#AEB7C5" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">REVERSE</text>
  <rect x="556" y="392" width="596" height="278" rx="28" fill="#FFFDF9"/>
  <text x="588" y="436" fill="#687386" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">FAVICON PROOFS</text>
