<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">DisplayList Explorer A production proof</title>
  <desc id="desc">Primary, monochrome, reverse, lockup, and favicon size tests for the DL Fold logo.</desc>
  <defs>
    <symbol id="primary" viewBox="0 0 64 64">
      <path fill="#172033" d="M8 7h24c15.46 0 27 10.67 27 25S47.46 57 32 57H8V7Z"/>
      <path fill="#F7F4EE" d="M20 19h7v19.5c0 .83.67 1.5 1.5 1.5H40v7H25.5a5.5 5.5 0 0 1-5.5-5.5V19Z"/>
      <rect width="7" height="7" x="32" y="29" rx="1.25" fill="#F7F4EE"/>
      <path fill="#EF5B2A" d="M40 40h7v7h-7z"/>
    </symbol>
    <symbol id="mono" viewBox="0 0 64 64">
      <path fill="currentColor" d="M8 7h24c15.46 0 27 10.67 27 25S47.46 57 32 57H8V7Z"/>
      <path fill="var(--proof-bg, #fff)" d="M20 19h7v19.5c0 .83.67 1.5 1.5 1.5H40v7H25.5a5.5 5.5 0 0 1-5.5-5.5V19Z"/>
      <rect width="7" height="7" x="32" y="29" rx="1.25" fill="var(--proof-bg, #fff)"/>
